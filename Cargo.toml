[package]
name = "che-tauri"
version = "0.1.1"
edition = "2024"

[features]
default = []
sync = ["dep:che-sync"]

[dependencies]
async-trait = "0.1"
che-orm = { version = "0.3.2", path = "../che-orm" }
che-sync = { version = "0.1", path = "../che-orm/che-sync", optional = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
tauri = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
