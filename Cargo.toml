[package]
name = "che-tauri"
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
description = "Typed Tauri application commands, ORM resources and offline synchronization"
license = "MIT"
readme = "README.md"
repository = "https://github.com/che4web/che-tauri"
homepage = "https://github.com/che4web/che-tauri"
documentation = "https://docs.rs/che-tauri"
keywords = ["tauri", "orm", "offline", "sync", "typescript"]
categories = ["database", "gui"]
exclude = ["che-back/**", "examples/**"]

[features]
default = []
sync = ["dep:che-sync"]
credentials = ["dep:tauri-plugin-stronghold"]

[dependencies]
async-trait = "0.1"
che-orm = { version = "0.3.3", path = "../che-orm" }
che-sync = { version = "0.1.3", path = "../che-orm/che-sync", optional = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["uuid1"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
tauri = "2"
tauri-plugin-stronghold = { version = "2", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
